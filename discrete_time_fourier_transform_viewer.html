"use strict";


/* 
 * Computes the discrete Fourier transform (DFT) of the given complex vector, storing the result back into the vector.
 * The vector can have any length. This is a wrapper function.
 */
function transform(real, imag) {
	var n = real.length;
	if (n != imag.length)
		throw "Mismatched lengths";
	if (n == 0)
		return;
	else if ((n & (n - 1)) == 0)  // Is power of 2
		transformRadix2(real, imag);
	else  // More complicated algorithm for arbitrary sizes
		transformBluestein(real, imag);
}


/* 
 * Computes the inverse discrete Fourier transform (IDFT) of the given complex vector, storing the result back into the vector.
 * The vector can have any length. This is a wrapper function. This transform does not perform scaling, so the inverse is not a true inverse.
 */
function inverseTransform(real, imag) {
	transform(imag, real);
}


/* 
 * Computes the discrete Fourier transform (DFT) of the given complex vector, storing the result back into the vector.
 * The vector's length must be a power of 2. Uses the Cooley-Tukey decimation-in-time radix-2 algorithm.
 */
function transformRadix2(real, imag) {
	// Length variables
	var n = real.length;
	if (n != imag.length)
		throw "Mismatched lengths";
	if (n == 1)  // Trivial transform
		return;
	var levels = -1;
	for (var i = 0; i < 32; i++) {
		if (1 << i == n)
			levels = i;  // Equal to log2(n)
	}
	if (levels == -1)
		throw "Length is not a power of 2";
	
	// Trigonometric tables
	var cosTable = new Array(n / 2);
	var sinTable = new Array(n / 2);
	for (var i = 0; i < n / 2; i++) {
		cosTable[i] = Math.cos(2 * Math.PI * i / n);
		sinTable[i] = Math.sin(2 * Math.PI * i / n);
	}
	
	// Bit-reversed addressing permutation
	for (var i = 0; i < n; i++) {
		var j = reverseBits(i, levels);
		if (j > i) {
			var temp = real[i];
			real[i] = real[j];
			real[j] = temp;
			temp = imag[i];
			imag[i] = imag[j];
			imag[j] = temp;
		}
	}
	
	// Cooley-Tukey decimation-in-time radix-2 FFT
	for (var size = 2; size <= n; size *= 2) {
		var halfsize = size / 2;
		var tablestep = n / size;
		for (var i = 0; i < n; i += size) {
			for (var j = i, k = 0; j < i + halfsize; j++, k += tablestep) {
				var l = j + halfsize;
				var tpre =  real[l] * cosTable[k] + imag[l] * sinTable[k];
				var tpim = -real[l] * sinTable[k] + imag[l] * cosTable[k];
				real[l] = real[j] - tpre;
				imag[l] = imag[j] - tpim;
				real[j] += tpre;
				imag[j] += tpim;
			}
		}
	}
	
	// Returns the integer whose value is the reverse of the lowest 'width' bits of the integer 'val'.
	function reverseBits(val, width) {
		var result = 0;
		for (var i = 0; i < width; i++) {
			result = (result << 1) | (val & 1);
			val >>>= 1;
		}
		return result;
	}
}


/* 
 * Computes the discrete Fourier transform (DFT) of the given complex vector, storing the result back into the vector.
 * The vector can have any length. This requires the convolution function, which in turn requires the radix-2 FFT function.
 * Uses Bluestein's chirp z-transform algorithm.
 */
function transformBluestein(real, imag) {
	// Find a power-of-2 convolution length m such that m >= n * 2 + 1
	var n = real.length;
	if (n != imag.length)
		throw "Mismatched lengths";
	var m = 1;
	while (m < n * 2 + 1)
		m *= 2;
	
	// Trigonometric tables
	var cosTable = new Array(n);
	var sinTable = new Array(n);
	for (var i = 0; i < n; i++) {
		var j = i * i % (n * 2);  // This is more accurate than j = i * i
		cosTable[i] = Math.cos(Math.PI * j / n);
		sinTable[i] = Math.sin(Math.PI * j / n);
	}
	
	// Temporary vectors and preprocessing
	var areal = newArrayOfZeros(m);
	var aimag = newArrayOfZeros(m);
	for (var i = 0; i < n; i++) {
		areal[i] =  real[i] * cosTable[i] + imag[i] * sinTable[i];
		aimag[i] = -real[i] * sinTable[i] + imag[i] * cosTable[i];
	}
	var breal = newArrayOfZeros(m);
	var bimag = newArrayOfZeros(m);
	breal[0] = cosTable[0];
	bimag[0] = sinTable[0];
	for (var i = 1; i < n; i++) {
		breal[i] = breal[m - i] = cosTable[i];
		bimag[i] = bimag[m - i] = sinTable[i];
	}
	
	// Convolution
	var creal = new Array(m);
	var cimag = new Array(m);
	convolveComplex(areal, aimag, breal, bimag, creal, cimag);
	
	// Postprocessing
	for (var i = 0; i < n; i++) {
		real[i] =  creal[i] * cosTable[i] + cimag[i] * sinTable[i];
		imag[i] = -creal[i] * sinTable[i] + cimag[i] * cosTable[i];
	}
}


/* 
 * Computes the circular convolution of the given real vectors. Each vector's length must be the same.
 */
function convolveReal(xvec, yvec, outvec) {
	var n = xvec.length;
	if (n != yvec.length || n != outvec.length)
		throw "Mismatched lengths";
	convolveComplex(xvec, newArrayOfZeros(n), yvec, newArrayOfZeros(n), outvec, newArrayOfZeros(n));
}


/* 
 * Computes the circular convolution of the given complex vectors. Each vector's length must be the same.
 */
function convolveComplex(xreal, ximag, yreal, yimag, outreal, outimag) {
	var n = xreal.length;
	if (n != ximag.length || n != yreal.length || n != yimag.length
			|| n != outreal.length || n != outimag.length)
		throw "Mismatched lengths";
	
	xreal = xreal.slice();
	ximag = ximag.slice();
	yreal = yreal.slice();
	yimag = yimag.slice();
	transform(xreal, ximag);
	transform(yreal, yimag);
	
	for (var i = 0; i < n; i++) {
		var temp = xreal[i] * yreal[i] - ximag[i] * yimag[i];
		ximag[i] = ximag[i] * yreal[i] + xreal[i] * yimag[i];
		xreal[i] = temp;
	}
	inverseTransform(xreal, ximag);
	
	for (var i = 0; i < n; i++) {  // Scaling (because this FFT implementation omits it)
		outreal[i] = xreal[i] / n;
		outimag[i] = ximag[i] / n;
	}
}


function newArrayOfZeros(n) {
	var result = [];
	for (var i = 0; i < n; i++)
		result.push(0);
	return result;
}

	<style>
		input {
			padding: 6px;
			font-family: sans-serif;
			font-size: 16pt;
			width: 75px;

		}

		input.math {
			width: 600px;
		}

		label {
			padding: 6px;

			font-size: 16pt;
			width: 100px;
		}

		body {
			background-color: #1e81b0;
		}

		html,

		form {
			margin: 20px;
		}

		button {
			font-family: sans-serif;
			font-size: 16pt;
			width: 100px;
			background-color: #e28743;

		}

		#div_plot {
			background-color: darkgreen;
		}

			font-family: sans-serif;
			font-size: 32pt;
			color: #eeeee4;
		}

</head>

<body>

	<form id="form_eq">
		<label for="eq">Enter f(t)=</label>
		<input class="math" id="eq" value="sin(50*2*PI*(t-5))/(50*2*PI*(t-5))*exp(i*150*2*PI*t)">
	</form>

	<form id="form_start">
		<label for="start">Start Value:</label>
		<input id="start" value="0" />
	</form>

	<form id="form_stop">
		<label for="stop">Stop Value:</label>
		<input id="stop" value="10.0" />
	</form>

	<form id="form_dt">
		<label for="dt">Sample Period:</label>
		<input id="dt" value="1E-3" />
	</form>

	<button type='button' id="button_draw" onclick=draw()>
		Draw
	</button>

	<div id="div_plot_ft_dB"></div>
	<div id="div_plot_ft_angle"></div>
	<div id="div_plot_re"></div>
	<div id="div_plot_im"></div>

	<script>

		function unwrap_angle(x) {
			var y = new Array(x.length)
			var accumulation = 0
			var prev = x[0]
			y[0] = prev
			for (let ii = 1; ii < x.length - 1; ii++) {
				current = x[ii]
				dif = current - prev
				if (dif < -math.PI) {
					accumulation += 2 * math.PI
				}
				if (dif > math.PI) {
					accumulation -= 2 * math.PI
				}
				y[ii] = current + accumulation
				prev = current
			}
			return y
		}

		function draw() {
			try {
				// compile the expression once
				const f_t = math.compile(document.getElementById('eq').value)
				const dt = math.compile(document.getElementById('dt').value).evaluate()
				const start = math.compile(document.getElementById('start').value).evaluate()
				const stop = math.compile(document.getElementById('stop').value).evaluate()

				// evaluate the expression repeatedly for different values of x
				const tValues = math.range(start, stop + dt, dt).toArray()
				const yValues = tValues.map(function (x) {
					return f_t.evaluate({ t: x })
				})

				var y_re = math.re(yValues)
				var y_im = math.im(yValues)

				var ft_re = math.clone(y_re)
				var ft_im = math.clone(y_im)
				transformBluestein(ft_re, ft_im)
				var ft = math.add(ft_re, math.multiply(ft_im, math.complex(0.0, 1.0)))
				var ft_dB = ft.map(function (x) { return 10 * math.log10(math.re(math.multiply(x, math.conj(x)))) })
				var ft_angle = math.arg(ft)
				var ft_angle_uw = unwrap_angle(ft_angle)

				var sample_rate = 1 / dt
				var df = sample_rate / (tValues.length - 1)
				const fValues = math.range(0, sample_rate + df, df).toArray()

				// render the plot using plotly
				var trace1 = {
					x: tValues,
					y: y_re,
					modes: 'lines+markers',
					marker: {
						color: 'red',
						size: 8
					},
					line: {
						color: 'black',
						width: 1
					}
				}
				var data = [trace1]
				var layout = {
					plot_bgcolor: '#abdbe3',
					paper_bgcolor: '#abdbe3',
					xaxis: {
						title: 't',
						showgrid: true,
						zeroline: true
					},
					yaxis: {
						title: 'Real f(t)',
						showgrid: true,
						zeroline: true
					}
				};
				Plotly.newPlot('div_plot_re', data, layout)

				var trace1 = {
					x: tValues,
					y: y_im,
					modes: 'lines+markers',
					marker: {
						color: 'red',
						size: 8
					},
					line: {
						color: 'black',
						width: 1
					}
				}
				var data = [trace1]
				var layout = {
					plot_bgcolor: '#abdbe3',
					paper_bgcolor: '#abdbe3',
					xaxis: {
						title: 't',
						showgrid: true,
						zeroline: true
					},
					yaxis: {
						title: 'Imag f(t)',
						showgrid: true,
						zeroline: true
					}
				};
				Plotly.newPlot('div_plot_im', data, layout)


				var trace1 = {
					x: fValues,
					y: ft_dB,
					modes: 'lines+markers',
					marker: {
						color: 'red',
						size: 8
					},
					line: {
						color: 'black',
						width: 1
					}
				}
				var data = [trace1]
				var layout = {
					plot_bgcolor: '#abdbe3',
					paper_bgcolor: '#abdbe3',
					xaxis: {
						title: 'Frequency (Hz)',
						showgrid: true,
						zeroline: true
					},
					yaxis: {
						title: 'Power (dB)',
						showgrid: true,
						zeroline: true
					}
				};
				Plotly.newPlot('div_plot_ft_dB', data, layout)

				var trace1 = {
					x: fValues,
					y: ft_angle_uw,
					modes: 'lines+markers',
					marker: {
						color: 'red',
						size: 8
					},
					line: {
						color: 'black',
						width: 1
					}
				}
				var data = [trace1]
				var layout = {
					plot_bgcolor: '#abdbe3',
					paper_bgcolor: '#abdbe3',
					xaxis: {
						title: 'Frequency (Hz)',
						showgrid: true,
						zeroline: true
					},
					yaxis: {
						title: 'Unwrapped Phase (radians)',
						showgrid: true,
						zeroline: true
					}
				};
				Plotly.newPlot('div_plot_ft_angle', data, layout)

			}
			catch (err) {
				console.error(err)
				alert(err)
			}
		}

		// Draw at start
		draw()
	</script>

</body>

</html>
